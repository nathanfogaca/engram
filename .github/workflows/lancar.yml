# Lança uma versão do Engram: suba uma tag com o número do package.json
#   git tag v0.2.0 && git push origin v0.2.0
# O GitHub Actions empacota o instalador do Windows e publica no GitHub Releases, junto com o
# latest.yml que o app instalado consulta para se atualizar sozinho.

name: Lançar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Conferir que a tag bate com a versão do package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSAO="v$(node -p "require('./package.json').version")"
          if [ "$VERSAO" != "${GITHUB_REF_NAME}" ]; then echo "A tag ${GITHUB_REF_NAME} não bate com o package.json ($VERSAO)"; exit 1; fi
      - name: Runtime do motor
        run: node scripts/preparar-motor.js
      - name: Empacotar e publicar no GitHub Releases
        # bash: o PowerShell quebra "-c.publish.repo=..." no ponto e o electron-builder lê como arquivo
        shell: bash
        run: npx electron-builder --win --publish always -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sem certificado de assinatura por enquanto: o Windows avisa na primeira instalação
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
